# =============================================================================
# IRDAI Corpus Updater — GitHub Actions Workflow
# =============================================================================
#
# Runs the IRDAI document crawler on a schedule (monthly, 1st day 00:00 UTC) and
# commits any new/updated documents + metadata changes back to the repo.
#
# Can also be triggered manually via workflow_dispatch.
#
# Required setup:
#   1. Push this file to .github/workflows/update_corpus.yml
#   2. Ensure the repo has write permissions for GitHub Actions:
#      Settings > Actions > General > Workflow permissions > Read and write
#   3. (Optional) Set repository secrets for notifications:
#      - SLACK_WEBHOOK_URL for Slack alerts
#
# =============================================================================

name: Update IRDAI Corpus

on:
  # Scheduled: runs monthly on the 1st day
  schedule:
    - cron: "0 0 1 * *"

  # Manual trigger with configurable parameters
  workflow_dispatch:
    inputs:
      max_downloads:
        description: "Max PDFs to download in this run"
        required: false
        default: "50"
      max_pages:
        description: "Max HTML pages to crawl"
        required: false
        default: "200"
      force:
        description: "Force re-download all documents"
        required: false
        default: false
        type: boolean

env:
  PYTHONIOENCODING: utf-8

jobs:
  update-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # ------------------------------------------------------------------
      # 1. Checkout the repository
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ------------------------------------------------------------------
      # 2. Set up Python
      # ------------------------------------------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ------------------------------------------------------------------
      # 3. Install dependencies
      # ------------------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------------------------------
      # 4. Run the incremental updater
      # ------------------------------------------------------------------
      - name: Run IRDAI corpus update
        run: |
          # Determine parameters
          MAX_DL="${{ github.event.inputs.max_downloads || '50' }}"
          MAX_PG="${{ github.event.inputs.max_pages || '200' }}"
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
            # A force run is a deliberate FULL REBUILD. Clear the ledger so the
            # whole corpus is re-fetched -- the downloader skips URLs already in
            # metadata.csv, so without this, --force alone re-downloads nothing.
            # Also raise the cap so cleaned_pdfs/ ends up holding the FULL corpus:
            # the mirror publish (step 7) refuses to run on a partial set.
            echo "FORCE rebuild: clearing metadata/changelog and raising download cap."
            rm -f metadata.csv changelog.csv pdf_links_cache.json
            if [ "$MAX_DL" -lt 5000 ]; then MAX_DL=5000; fi
          fi

          echo "=== Running IRDAI Corpus Update ==="
          echo "Max downloads: $MAX_DL"
          echo "Max pages: $MAX_PG"
          echo "Force: ${{ github.event.inputs.force || 'false' }}"

          python main.py --update \
            --max-downloads "$MAX_DL" \
            --max-pages "$MAX_PG" \
            $FORCE_FLAG \
            --verbose

      # ------------------------------------------------------------------
      # 5. Check if metadata/changelog changed
      # ------------------------------------------------------------------
      - name: Check for changes
        id: check_changes
        run: |
          git add metadata.csv changelog.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No metadata changes detected."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected:"
            git diff --cached --stat
          fi

          # Check if any new PDFs were downloaded
          if [ -d cleaned_pdfs ] && [ "$(ls -A cleaned_pdfs 2>/dev/null)" ]; then
            PDF_COUNT=$(ls cleaned_pdfs/*.pdf 2>/dev/null | wc -l)
            echo "pdf_count=$PDF_COUNT" >> $GITHUB_OUTPUT
            echo "Found $PDF_COUNT cleaned PDF(s)."
          else
            echo "pdf_count=0" >> $GITHUB_OUTPUT
          fi

      # ------------------------------------------------------------------
      # 6. Commit & push metadata changes (PDFs are gitignored)
      # ------------------------------------------------------------------
      - name: Commit and push metadata
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "IRDAI Corpus Bot"
          git config user.email "bot@irdai-corpus.local"

          DATE=$(date -u '+%Y-%m-%d')
          COMMIT_MSG="chore: corpus metadata update ${DATE}

          - Metadata and changelog updated
          - Auto-generated by GitHub Actions"

          git commit -m "$COMMIT_MSG"
          git push

      # ------------------------------------------------------------------
      # 7. Publish cleaned PDFs to the Hugging Face Dataset
      # ------------------------------------------------------------------
      #   * Scheduled runs (force=false) -> incremental: ADD new PDFs and DELETE
      #       only the files metadata.csv marks superseded. Never wipes HF, so it
      #       is safe even though the runner's cleaned_pdfs/ holds only new files.
      #   * Force rebuilds (force=true)  -> mirror: make HF exactly match the
      #       freshly rebuilt full corpus. Guarded: refuses to run on a partial
      #       cleaned_pdfs/, so a half-finished crawl can never wipe the dataset.
      - name: Publish to Hugging Face
        if: steps.check_changes.outputs.pdf_count != '0'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e  # Fail on any error
          pip install "huggingface_hub>=0.20" --quiet

          echo "HF_TOKEN is set: $([ -n "$HF_TOKEN" ] && echo 'yes' || echo 'NO')"
          echo "Files in cleaned_pdfs/:"
          ls -la cleaned_pdfs/ | head -20

          MODE="incremental"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            MODE="mirror"
          fi
          echo "Publishing to Hugging Face (mode=$MODE)..."
          python publish_hf.py --mode "$MODE"

      # ------------------------------------------------------------------
      # 8. Upload artifacts (metadata + changelog for review)
      # ------------------------------------------------------------------
      - name: Upload corpus metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-metadata-${{ github.run_number }}
          path: |
            metadata.csv
            changelog.csv
          retention-days: 30

      # ------------------------------------------------------------------
      # 9. Summary output
      # ------------------------------------------------------------------
      - name: Print summary
        if: always()
        run: |
          echo "## IRDAI Corpus Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Run date | $(date -u '+%Y-%m-%d %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "| Metadata changed | ${{ steps.check_changes.outputs.changed || 'unknown' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Cleaned PDFs | ${{ steps.check_changes.outputs.pdf_count || '0' }} |" >> $GITHUB_STEP_SUMMARY

          if [ -f metadata.csv ]; then
            TOTAL_DOCS=$(tail -n +2 metadata.csv | wc -l)
            GOLD_DOCS=$(grep -c ',gold,' metadata.csv || true)
            SILVER_DOCS=$(grep -c ',silver,' metadata.csv || true)
            echo "| Total documents | ${TOTAL_DOCS} |" >> $GITHUB_STEP_SUMMARY
            echo "| Gold tier | ${GOLD_DOCS} |" >> $GITHUB_STEP_SUMMARY
            echo "| Silver tier | ${SILVER_DOCS} |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f changelog.csv ]; then
            CHANGELOG_LINES=$(tail -n +2 changelog.csv | wc -l)
            echo "| Changelog entries | ${CHANGELOG_LINES} |" >> $GITHUB_STEP_SUMMARY
          fi

